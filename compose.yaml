
services:
  db:
    image: postgres:16
    container_name: doctor-appointments-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: doctor_appointments
      POSTGRES_USER: doctor_app
      POSTGRES_PASSWORD: change_me_dev_only

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctor_app -d doctor_appointments"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
